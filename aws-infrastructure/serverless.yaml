AWSTemplateFormatVersion: '2010-09-09'
Description: One Markdown MCP Lambda and Regional streaming REST API; existing ECS, CloudFront, Cognito and data remain owned by their stacks.
Parameters:
  ImageUri:
    Type: String
    AllowedPattern: '^249766001220\.dkr\.ecr\.ca-central-1\.amazonaws\.com/markdown-mcp-service@sha256:[a-f0-9]{64}$'
  ReleaseId:
    Type: String
    AllowedPattern: '^[a-f0-9]{64}$'
  PublicBaseUrl:
    Type: String
    AllowedPattern: '^https://[a-z0-9]+\.cloudfront\.net$'
  ClientId:
    Type: String
    AllowedPattern: '^[a-z0-9]+$'
  AllowedSubject:
    Type: String
    AllowedPattern: '^[a-f0-9-]{36}$'
  OAuthSecretArn:
    Type: String
    AllowedPattern: '^arn:aws:secretsmanager:ca-central-1:249766001220:secret:markdown-mcp-service-oauth-key-[A-Za-z0-9]{6}$'
  ReservedConcurrency:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 10
Conditions:
  HasReservedConcurrency: !Not [!Equals [!Ref ReservedConcurrency, 0]]
Resources:
  Logs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/markdown-mcp-service
      RetentionInDays: 7
  Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: markdown-mcp-service-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: MarkdownMcpRuntime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/markdown-mcp-service*:*'
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: arn:aws:s3:::agent-work-history--249766001220-ca-central-1/agent-work/raw-markdown/gopalcbala/*
              - Effect: Deny
                Action: [s3:DeleteObject, s3:DeleteObjectVersion]
                Resource: arn:aws:s3:::agent-work-history--249766001220-ca-central-1/*
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:GetItem]
                Resource: arn:aws:dynamodb:ca-central-1:249766001220:table/softrobots-document-api-user-files
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:LeadingKeys: [gopalcbala]
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem]
                Resource: arn:aws:dynamodb:ca-central-1:249766001220:table/markdown-mcp-service-oauth
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref OAuthSecretArn
  Function:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: markdown-mcp-service
      PackageType: Image
      Code: {ImageUri: !Ref ImageUri}
      Architectures: [x86_64]
      Role: !GetAtt Role.Arn
      MemorySize: 1024
      Timeout: 180
      ReservedConcurrentExecutions: !If [HasReservedConcurrency, !Ref ReservedConcurrency, !Ref AWS::NoValue]
      Environment:
        Variables:
          MCP_ENABLED: 'true'
          PUBLIC_BASE_URL: !Ref PublicBaseUrl
          MCP_RESOURCE: !Sub '${PublicBaseUrl}/mcp/'
          MCP_ORIGIN_HOST: !Sub '${Api}.execute-api.${AWS::Region}.amazonaws.com'
          MCP_WRITE_SCOPE: markdown-api/write
          COGNITO_ISSUER: https://cognito-idp.ca-central-1.amazonaws.com/ca-central-1_VwnNJYce8
          COGNITO_CLIENT_ID: !Ref ClientId
          COGNITO_DOMAIN: https://softrobots-usernames-249766001220.auth.ca-central-1.amazoncognito.com
          ALLOWED_SUB: !Ref AllowedSubject
          S3_BUCKET: agent-work-history--249766001220-ca-central-1
          USER_FILES_TABLE: softrobots-document-api-user-files
          OAUTH_STATE_TABLE: markdown-mcp-service-oauth
          OAUTH_SECRET_ARN: !Ref OAuthSecretArn
          OAUTH_STATE_NAMESPACE: ''
      Tags:
        - {Key: Project, Value: markdown-mcp-service-serverless}
  Version:
    Type: AWS::Lambda::Version
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Ref Function
      Description: !Ref ReleaseId
  Alias:
    Type: AWS::Lambda::Alias
    Properties:
      Name: live
      FunctionName: !Ref Function
      FunctionVersion: !GetAtt Version.Version
  Api:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: markdown-mcp-service-serverless
      EndpointConfiguration: {Types: [REGIONAL]}
      Tags:
        - {Key: Project, Value: markdown-mcp-service-serverless}
  Proxy:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref Api
      ParentId: !GetAtt Api.RootResourceId
      PathPart: '{proxy+}'
  RootMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !GetAtt Api.RootResourceId
      HttpMethod: ANY
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2021-11-15/functions/${Alias}/response-streaming-invocations'
        ResponseTransferMode: STREAM
        TimeoutInMillis: 180000
  ProxyMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref Api
      ResourceId: !Ref Proxy
      HttpMethod: ANY
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2021-11-15/functions/${Alias}/response-streaming-invocations'
        ResponseTransferMode: STREAM
        TimeoutInMillis: 180000
  Deployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: [RootMethod, ProxyMethod]
    Properties:
      RestApiId: !Ref Api
      Description: !Ref ReleaseId
  Stage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref Api
      DeploymentId: !Ref Deployment
      StageName: live
      MethodSettings:
        - ResourcePath: /*
          HttpMethod: '*'
          ThrottlingBurstLimit: 10
          ThrottlingRateLimit: 1
          MetricsEnabled: true
          DataTraceEnabled: false
      Tags:
        - {Key: Project, Value: markdown-mcp-service-serverless}
  Permission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Alias
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*'
      SourceAccount: !Ref AWS::AccountId
Outputs:
  PublicBaseUrl:
    Value: !Ref PublicBaseUrl
  ClientId:
    Value: !Ref ClientId
  RuntimeRoleArn:
    Value: !GetAtt Role.Arn
  ReleaseId:
    Value: !Ref ReleaseId
  ImageUri:
    Value: !Ref ImageUri
  Origin:
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com'
  OriginPath:
    Value: /live
  FunctionArn:
    Value: !GetAtt Function.Arn
  AliasArn:
    Value: !Ref Alias
  Version:
    Value: !GetAtt Version.Version
  ReservedConcurrency:
    Value: !Ref ReservedConcurrency

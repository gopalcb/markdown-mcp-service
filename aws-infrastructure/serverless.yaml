AWSTemplateFormatVersion: '2010-09-09'
Description: One Markdown MCP Lambda with a streaming function URL; existing ECS, CloudFront, Cognito and data remain owned by their stacks.
Parameters:
  ImageUri:
    Type: String
    AllowedPattern: '^249766001220\.dkr\.ecr\.ca-central-1\.amazonaws\.com/markdown-mcp-service@sha256:[a-f0-9]{64}$'
  ReleaseId:
    Type: String
    AllowedPattern: '^[a-f0-9]{64}$'
  PublicBaseUrl:
    Type: String
    AllowedPattern: '^https://[a-z0-9]+\.cloudfront\.net$'
  ClientId:
    Type: String
    AllowedPattern: '^[a-z0-9]+$'
  AllowedSubject:
    Type: String
    AllowedPattern: '^[a-f0-9-]{36}$'
  OAuthSecretArn:
    Type: String
    AllowedPattern: '^arn:aws:secretsmanager:ca-central-1:249766001220:secret:markdown-mcp-service-oauth-key-[A-Za-z0-9]{6}$'
  ReservedConcurrency:
    Type: Number
    Default: 10
    MinValue: 10
    MaxValue: 10
  OriginHostname:
    Type: String
    AllowedPattern: '^(?:[a-z0-9]+\.execute-api\.ca-central-1\.amazonaws\.com|[a-z0-9]+\.lambda-url\.ca-central-1\.on\.aws)$'
    Description: Exact current or newly allocated direct origin host; CI converges this to the function URL before verification.
Resources:
  Logs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/markdown-mcp-service
      RetentionInDays: 7
  Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: markdown-mcp-service-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: MarkdownMcpRuntime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/markdown-mcp-service*:*'
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: arn:aws:s3:::agent-work-history--249766001220-ca-central-1/agent-work/raw-markdown/gopalcbala/*
              - Effect: Deny
                Action: [s3:DeleteObject, s3:DeleteObjectVersion]
                Resource: arn:aws:s3:::agent-work-history--249766001220-ca-central-1/*
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:GetItem]
                Resource: arn:aws:dynamodb:ca-central-1:249766001220:table/softrobots-document-api-user-files
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:LeadingKeys: [gopalcbala]
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem]
                Resource: arn:aws:dynamodb:ca-central-1:249766001220:table/markdown-mcp-service-oauth
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref OAuthSecretArn
  Function:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: markdown-mcp-service
      PackageType: Image
      Code: {ImageUri: !Ref ImageUri}
      Architectures: [x86_64]
      Role: !GetAtt Role.Arn
      MemorySize: 1024
      Timeout: 180
      ReservedConcurrentExecutions: !Ref ReservedConcurrency
      Environment:
        Variables:
          MCP_ENABLED: 'true'
          PUBLIC_BASE_URL: !Ref PublicBaseUrl
          MCP_RESOURCE: !Sub '${PublicBaseUrl}/mcp/'
          MCP_ORIGIN_HOST: !Ref OriginHostname
          MCP_WRITE_SCOPE: markdown-api/write
          COGNITO_ISSUER: https://cognito-idp.ca-central-1.amazonaws.com/ca-central-1_VwnNJYce8
          COGNITO_CLIENT_ID: !Ref ClientId
          COGNITO_DOMAIN: https://softrobots-usernames-249766001220.auth.ca-central-1.amazoncognito.com
          ALLOWED_SUB: !Ref AllowedSubject
          S3_BUCKET: agent-work-history--249766001220-ca-central-1
          USER_FILES_TABLE: softrobots-document-api-user-files
          OAUTH_STATE_TABLE: markdown-mcp-service-oauth
          OAUTH_SECRET_ARN: !Ref OAuthSecretArn
          OAUTH_STATE_NAMESPACE: ''
      Tags:
        - {Key: Project, Value: markdown-mcp-service-serverless}
  Version:
    Type: AWS::Lambda::Version
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Ref Function
      Description: !Ref ReleaseId
  Alias:
    Type: AWS::Lambda::Alias
    Properties:
      Name: live
      FunctionName: !Ref Function
      FunctionVersion: !GetAtt Version.Version
  FunctionUrl:
    Type: AWS::Lambda::Url
    DependsOn: Alias
    Properties:
      TargetFunctionArn: !Ref Function
      Qualifier: live
      AuthType: NONE
      InvokeMode: RESPONSE_STREAM
  FunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Alias
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE
  FunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Alias
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true
Outputs:
  PublicBaseUrl:
    Value: !Ref PublicBaseUrl
  ClientId:
    Value: !Ref ClientId
  RuntimeRoleArn:
    Value: !GetAtt Role.Arn
  ReleaseId:
    Value: !Ref ReleaseId
  ImageUri:
    Value: !Ref ImageUri
  Origin:
    Value: !GetAtt FunctionUrl.FunctionUrl
  OriginPath:
    Value: ''
  FunctionArn:
    Value: !GetAtt Function.Arn
  AliasArn:
    Value: !Ref Alias
  Version:
    Value: !GetAtt Version.Version
  ReservedConcurrency:
    Value: !Ref ReservedConcurrency

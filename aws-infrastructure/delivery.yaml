AWSTemplateFormatVersion: '2010-09-09'
Description: Independent GitHub deployment identity for Markdown MCP on the existing
  Softrobots cluster.
Resources:
  DeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: markdown-mcp-service-github-role
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action: sts:AssumeRoleWithWebIdentity
          Principal:
            Federated: arn:aws:iam::249766001220:oidc-provider/token.actions.githubusercontent.com
          Condition:
            StringEquals:
              token.actions.githubusercontent.com:aud: sts.amazonaws.com
              token.actions.githubusercontent.com:sub: repo:gopalcb@13314049/markdown-mcp-service@1439586244:ref:refs/heads/main
      Policies:
      - PolicyName: DeployStandaloneMarkdownMcp
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: ManageDedicatedMcpStack
            Effect: Allow
            Action:
            - cloudformation:CreateStack
            - cloudformation:UpdateStack
            - cloudformation:DeleteStack
            Resource:
            - arn:aws:cloudformation:ca-central-1:249766001220:stack/markdown-mcp-service*/*
          - Sid: ReadMcpStack
            Effect: Allow
            Action:
            - cloudformation:DescribeStacks
            - cloudformation:DescribeStackEvents
            Resource:
            - arn:aws:cloudformation:ca-central-1:249766001220:stack/markdown-mcp-service*/*
          - Sid: PassMcpRuntimeRoles
            Effect: Allow
            Action: iam:PassRole
            Resource:
            - arn:aws:iam::249766001220:role/markdown-mcp-service-task-role
            - arn:aws:iam::249766001220:role/markdown-mcp-service-execution-role
            - arn:aws:iam::249766001220:role/softrobots-ecs-infrastructure-role
            Condition:
              StringEquals:
                iam:PassedToService:
                - ecs.amazonaws.com
                - ecs-tasks.amazonaws.com
          - Sid: PublishMcpImages
            Effect: Allow
            Action:
            - ecr:DescribeImages
            - ecr:BatchCheckLayerAvailability
            - ecr:InitiateLayerUpload
            - ecr:UploadLayerPart
            - ecr:CompleteLayerUpload
            - ecr:PutImage
            - ecr:BatchGetImage
            - ecr:GetDownloadUrlForLayer
            Resource: arn:aws:ecr:ca-central-1:249766001220:repository/markdown-mcp-service
          - Sid: TagMcpTasks
            Effect: Allow
            Action: ecs:TagResource
            Resource: arn:aws:ecs:ca-central-1:249766001220:task-definition/markdown-mcp-service*:*
          - Sid: ReadOwnerIdentity
            Effect: Allow
            Action: cognito-idp:AdminGetUser
            Resource: arn:aws:cognito-idp:ca-central-1:249766001220:userpool/ca-central-1_VwnNJYce8
          - Sid: VerifyExistingStorage
            Effect: Allow
            Action:
            - s3:GetBucketVersioning
            - s3:GetEncryptionConfiguration
            - s3:GetBucketPublicAccessBlock
            - s3:GetBucketPolicy
            Resource: arn:aws:s3:::agent-work-history--249766001220-ca-central-1
          - Sid: ManageOnlyMcpRoles
            Effect: Allow
            Action:
            - iam:CreateRole
            - iam:GetRole
            - iam:UpdateAssumeRolePolicy
            - iam:DeleteRole
            - iam:TagRole
            - iam:UntagRole
            - iam:ListRoleTags
            - iam:ListRolePolicies
            - iam:GetRolePolicy
            - iam:PutRolePolicy
            - iam:DeleteRolePolicy
            - iam:ListAttachedRolePolicies
            Resource:
            - arn:aws:iam::249766001220:role/markdown-mcp-service-task-role
            - arn:aws:iam::249766001220:role/markdown-mcp-service-execution-role
            - arn:aws:iam::249766001220:role/markdown-mcp-service-lambda-role
          - Sid: ManageOnlyMcpRepository
            Effect: Allow
            Action:
            - ecr:CreateRepository
            - ecr:DescribeRepositories
            - ecr:GetLifecyclePolicy
            - ecr:GetRepositoryPolicy
            - ecr:SetRepositoryPolicy
            - ecr:PutImageTagMutability
            - ecr:PutImageScanningConfiguration
            - ecr:TagResource
            - ecr:UntagResource
            - ecr:ListTagsForResource
            Resource: arn:aws:ecr:ca-central-1:249766001220:repository/markdown-mcp-service
          - Sid: ManageOnlyMcpLogs
            Effect: Allow
            Action:
            - logs:CreateLogGroup
            - logs:DeleteLogGroup
            - logs:PutRetentionPolicy
            - logs:DeleteRetentionPolicy
            - logs:TagResource
            - logs:UntagResource
            - logs:ListTagsForResource
            Resource:
            - arn:aws:logs:ca-central-1:249766001220:log-group:/markdown-mcp-service
            - arn:aws:logs:ca-central-1:249766001220:log-group:/markdown-mcp-service:*
            - arn:aws:logs:ca-central-1:249766001220:log-group:/aws/lambda/markdown-mcp-service*
            - arn:aws:logs:ca-central-1:249766001220:log-group:/aws/lambda/markdown-mcp-service*:*
          - Sid: DescribeLogs
            Effect: Allow
            Action: logs:DescribeLogGroups
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestedRegion: ca-central-1
          - Sid: ManageMcpCognitoResources
            Effect: Allow
            Action:
            - cognito-idp:CreateUserPoolClient
            - cognito-idp:DescribeUserPoolClient
            - cognito-idp:UpdateUserPoolClient
            - cognito-idp:DeleteUserPoolClient
            - cognito-idp:CreateResourceServer
            - cognito-idp:DescribeResourceServer
            - cognito-idp:UpdateResourceServer
            - cognito-idp:DeleteResourceServer
            - cognito-idp:CreateManagedLoginBranding
            - cognito-idp:DescribeManagedLoginBranding
            - cognito-idp:UpdateManagedLoginBranding
            - cognito-idp:DeleteManagedLoginBranding
            Resource: arn:aws:cognito-idp:ca-central-1:249766001220:userpool/ca-central-1_VwnNJYce8
          - Sid: ReadNetworkAndAuthenticateRegistry
            Effect: Allow
            Action:
            - ecr:GetAuthorizationToken
            - ec2:DescribeVpcs
            - ec2:DescribeSubnets
            - ec2:DescribeRouteTables
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestedRegion: ca-central-1
          - Sid: RequireExistingCluster
            Effect: Allow
            Action: ecs:DescribeClusters
            Resource: arn:aws:ecs:ca-central-1:249766001220:cluster/softrobots-systems
          - Sid: ManageOnlyMcpService
            Effect: Allow
            Action:
            - ecs:CreateExpressGatewayService
            - ecs:UpdateExpressGatewayService
            - ecs:DescribeExpressGatewayService
            - ecs:DeleteExpressGatewayService
            - ecs:DescribeServices
            - ecs:ListServiceDeployments
            - ecs:TagResource
            Resource: arn:aws:ecs:ca-central-1:249766001220:service/softrobots-systems/markdown-mcp-service
          - Sid: RegisterMcpTaskRevisions
            Effect: Allow
            Action: ecs:RegisterTaskDefinition
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestedRegion: ca-central-1
          - Sid: ManageExpressGateway
            Effect: Allow
            Action:
            - ecs:CreateGateway
            - ecs:TagResource
            Resource: arn:aws:ecs:ca-central-1:249766001220:gateway/*
          - Sid: AssociateOnlyExistingCluster
            Effect: Allow
            Action: ecs:AssociateGatewayWithCluster
            Resource:
            - arn:aws:ecs:ca-central-1:249766001220:cluster/softrobots-systems
            - arn:aws:ecs:ca-central-1:249766001220:gateway/*
            Condition:
              ArnEquals:
                ecs:cluster: arn:aws:ecs:ca-central-1:249766001220:cluster/softrobots-systems
          - Sid: CreateOwnedMcpEdge
            Effect: Allow
            Action: cloudfront:CreateDistribution
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestTag/Project: markdown-mcp-service-edge
              ForAnyValue:StringEquals:
                aws:CalledVia:
                - cloudformation.amazonaws.com
          - Sid: TagMcpEdgeThroughCloudFormation
            Effect: Allow
            Action: cloudfront:TagResource
            Resource: arn:aws:cloudfront::249766001220:distribution/*
            Condition:
              StringEquals:
                aws:RequestTag/Project: markdown-mcp-service-edge
              ForAnyValue:StringEquals:
                aws:CalledVia:
                - cloudformation.amazonaws.com
          - Sid: ManageOnlyOwnedMcpEdge
            Effect: Allow
            Action:
            - cloudfront:GetDistribution
            - cloudfront:GetDistributionConfig
            - cloudfront:UpdateDistribution
            - cloudfront:DeleteDistribution
            - cloudfront:ListTagsForResource
            Resource: arn:aws:cloudfront::249766001220:distribution/*
            Condition:
              StringEquals:
                aws:ResourceTag/Project: markdown-mcp-service-edge
          - Sid: RemoveOnlyNonOwnershipEdgeTags
            Effect: Allow
            Action: cloudfront:UntagResource
            Resource: arn:aws:cloudfront::249766001220:distribution/*
            Condition:
              StringEquals:
                aws:ResourceTag/Project: markdown-mcp-service-edge
              ForAllValues:StringNotEquals:
                aws:TagKeys:
                - Project
              ForAnyValue:StringEquals:
                aws:CalledVia:
                - cloudformation.amazonaws.com
          - Sid: ManageOnlyMcpOAuthState
            Effect: Allow
            Action:
            - dynamodb:CreateTable
            - dynamodb:UpdateTable
            - dynamodb:DeleteTable
            - dynamodb:DescribeTable
            - dynamodb:UpdateTimeToLive
            - dynamodb:DescribeTimeToLive
            - dynamodb:TagResource
            - dynamodb:UntagResource
            - dynamodb:ListTagsOfResource
            - dynamodb:DescribeContinuousBackups
            - dynamodb:DescribeContributorInsights
            - dynamodb:DescribeKinesisStreamingDestination
            - dynamodb:GetResourcePolicy
            Resource: arn:aws:dynamodb:ca-central-1:249766001220:table/markdown-mcp-service-oauth
          - Sid: ManageOnlyMcpOAuthKey
            Effect: Allow
            Action:
            - secretsmanager:CreateSecret
            - secretsmanager:UpdateSecret
            - secretsmanager:DeleteSecret
            - secretsmanager:RestoreSecret
            - secretsmanager:DescribeSecret
            - secretsmanager:TagResource
            - secretsmanager:UntagResource
            - secretsmanager:PutSecretValue
            Resource: arn:aws:secretsmanager:ca-central-1:249766001220:secret:markdown-mcp-service-oauth-key-??????
          - Sid: GenerateMcpOAuthKey
            Effect: Allow
            Action: secretsmanager:GetRandomPassword
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestedRegion: ca-central-1
          - Sid: ReadMcpOAuthKeyOnlyThroughCloudFormation
            Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: arn:aws:secretsmanager:ca-central-1:249766001220:secret:markdown-mcp-service-oauth-key-??????
            Condition:
              ForAnyValue:StringEquals:
                aws:CalledVia:
                - cloudformation.amazonaws.com
          - Sid: PassMcpLambdaRole
            Effect: Allow
            Action: iam:PassRole
            Resource: arn:aws:iam::249766001220:role/markdown-mcp-service-lambda-role
            Condition:
              StringEquals:
                iam:PassedToService: lambda.amazonaws.com
          - Sid: ManageMcpLambda
            Effect: Allow
            Action:
            - lambda:CreateFunction
            - lambda:UpdateFunctionCode
            - lambda:UpdateFunctionConfiguration
            - lambda:GetFunction
            - lambda:GetFunctionConfiguration
            - lambda:CreateFunctionUrlConfig
            - lambda:GetFunctionUrlConfig
            - lambda:UpdateFunctionUrlConfig
            - lambda:DeleteFunctionUrlConfig
            - lambda:DeleteFunction
            - lambda:PublishVersion
            - lambda:CreateAlias
            - lambda:GetAlias
            - lambda:UpdateAlias
            - lambda:DeleteAlias
            - lambda:AddPermission
            - lambda:RemovePermission
            - lambda:GetPolicy
            - lambda:PutFunctionConcurrency
            - lambda:DeleteFunctionConcurrency
            - lambda:GetFunctionConcurrency
            - lambda:TagResource
            - lambda:UntagResource
            - lambda:ListTags
            - lambda:ListVersionsByFunction
            Resource:
            - arn:aws:lambda:ca-central-1:249766001220:function:markdown-mcp-service
            - arn:aws:lambda:ca-central-1:249766001220:function:markdown-mcp-service:*
          - Sid: ReadLambdaCapacity
            Effect: Allow
            Action: lambda:GetAccountSettings
            Resource: '*'
          - Sid: ManageMcpRestApiViaCloudFormation
            Effect: Allow
            Action:
            - apigateway:GET
            - apigateway:POST
            - apigateway:PUT
            - apigateway:PATCH
            - apigateway:DELETE
            Resource:
            - arn:aws:apigateway:ca-central-1::/restapis
            - arn:aws:apigateway:ca-central-1::/restapis/*
            - arn:aws:apigateway:ca-central-1::/tags/*
            Condition:
              ForAnyValue:StringEquals:
                aws:CalledVia:
                - cloudformation.amazonaws.com
      Tags:
      - Key: Project
        Value: markdown-mcp-service
Outputs:
  DeploymentRoleArn:
    Value: arn:aws:iam::249766001220:role/markdown-mcp-service-github-role
  OidcSubject:
    Value: repo:gopalcb@13314049/markdown-mcp-service@1439586244:ref:refs/heads/main

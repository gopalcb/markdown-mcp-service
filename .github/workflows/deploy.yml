name: Test and deploy Markdown MCP

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: markdown-mcp-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: ca-central-1
  AWS_DEFAULT_REGION: ca-central-1

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install locked service and validation dependencies
        run: python -m pip install -r requirements.txt -r requirements-client.txt pytest==9.1.1 cfn-lint==1.58.0
      - name: Verify installed LangChain MCP client libraries
        run: python -c "from langchain.mcp import MCPAdapter; import fastmcp, mcp"
      - run: python -m pytest -q tests scripts/tests
      - run: cfn-lint aws-infrastructure/template.yaml aws-infrastructure/delivery.yaml aws-infrastructure/edge.yaml
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the image to be deployed
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: markdown-mcp-service:test
          cache-from: type=gha,scope=markdown-mcp
          cache-to: type=gha,scope=markdown-mcp,mode=max
      - name: Verify image imports and nonroot runtime
        run: |
          docker run --rm --entrypoint python markdown-mcp-service:test -c \
            'import os; assert os.getuid() != 0; import fastapi, fastmcp, mcp, jwt, boto3'
      - name: Export the tested image
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: docker save -o /tmp/markdown-mcp-image.tar markdown-mcp-service:test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        with:
          name: markdown-mcp-image-${{ github.run_id }}
          path: /tmp/markdown-mcp-image.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: validate
    if: >-
      github.repository == 'gopalcb/markdown-mcp-service' &&
      github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ca-central-1
          role-to-assume: arn:aws:iam::249766001220:role/markdown-mcp-service-github-role
          role-session-name: MarkdownMcp-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 3600
          allowed-account-ids: '249766001220'
          unset-current-credentials: true
      - name: Provision dedicated image, roles and OAuth resources
        run: python scripts/deploy.py provision
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: markdown-mcp-image-${{ github.run_id }}
          path: /tmp/mcp-image
      - name: Publish the tested image with an immutable release tag
        env:
          RELEASE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          registry=249766001220.dkr.ecr.ca-central-1.amazonaws.com
          image="$registry/markdown-mcp-service:$RELEASE_TAG"
          docker load -i /tmp/mcp-image/markdown-mcp-image.tar
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          trap 'docker logout "$registry" >/dev/null' EXIT
          docker tag markdown-mcp-service:test "$image"
          docker push "$image"
          digest=$(aws ecr describe-images --repository-name markdown-mcp-service \
            --image-ids imageTag="$RELEASE_TAG" --query 'imageDetails[0].imageDigest' --output text)
          printf '%s\n' "$registry/markdown-mcp-service@$digest" > /tmp/markdown-mcp-image.txt
      - name: Deploy one dedicated ECS Express service and verify its public boundary
        run: python scripts/deploy.py deploy --image "$(cat /tmp/markdown-mcp-image.txt)"
      - name: Publish nonsecret deployment evidence
        run: |
          cat /tmp/markdown-mcp-deployment.json >> "$GITHUB_STEP_SUMMARY"
          printf '\nAuthenticated OAuth, OTP, refresh and upload require separate private acceptance testing.\n' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: markdown-mcp-deployment-${{ github.run_id }}
          path: |
            /tmp/markdown-mcp-stack.json
            /tmp/markdown-mcp-deployment.json
          retention-days: 30
          if-no-files-found: error
